<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>three-text WebGL Vector Example</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    #status {
      position: fixed;
      bottom: 50px;
      left: 20px;
      padding: 10px 15px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 4px;
      font-size: 12px;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .status-loading { color: #ffa500; }
    .status-ready { color: #00ff00; }
    .status-error { color: #ff4444; }
  </style>
</head>
<body>
  <div id="status" class="status-loading">Initializing WebGL vector renderer...</div>
  <canvas id="canvas"></canvas>

  <script type="module">
    import { Text } from '../dist/vector/core/index.js';
    import { createWebGLVectorRenderer } from '../dist/vector/webgl/index.js';

    const status = document.getElementById('status');

    async function main() {
      const canvas = document.getElementById('canvas');
      const gl = canvas.getContext('webgl2', { antialias: true });

      if (!gl) {
        status.textContent = 'WebGL2 is required';
        status.className = 'status-error';
        return;
      }

      const devicePixelRatio = window.devicePixelRatio || 1;
      const resize = () => {
        canvas.width = Math.max(1, Math.floor(canvas.clientWidth * devicePixelRatio));
        canvas.height = Math.max(1, Math.floor(canvas.clientHeight * devicePixelRatio));
        gl.viewport(0, 0, canvas.width, canvas.height);
      };
      resize();

      gl.clearColor(0.05, 0.05, 0.05, 1.0);

      status.textContent = 'Loading font and shaping text...';
      Text.setHarfBuzzPath('/examples/hb/hb.wasm');

      const result = await Text.create({
        text: 'Hello WebGL!',
        font: './fonts/NimbusSanL-Reg.woff',
        size: 72
      });

      const renderer = createWebGLVectorRenderer(gl);
      renderer.setGeometry(result.gpuData);

      const bounds = result.planeBounds;
      const centerX = (bounds.min.x + bounds.max.x) * 0.5;
      const centerY = (bounds.min.y + bounds.max.y) * 0.5;
      const width = Math.max(1, bounds.max.x - bounds.min.x);

      let yaw = 0.4;
      let pitch = 0.2;
      let zoom = 1.0;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      const color = new Float32Array([1, 1, 1, 1]);

      function buildMvp() {
        const aspect = canvas.width / canvas.height;
        const baseScale = 2 / (width * 1.8);
        const scaleX = baseScale / zoom;
        const scaleY = (baseScale * aspect) / zoom;

        const cy = Math.cos(yaw);
        const sy = Math.sin(yaw);
        const cp = Math.cos(pitch);
        const sp = Math.sin(pitch);

        const tx = -centerX * scaleX;
        const ty = -centerY * scaleY;

        // Slug's shader reads a custom packed 2D projective transform:
        // each vec4 is one output component's coefficients plus translation in .w.
        return new Float32Array([
          scaleX * cy,       0,                 0, tx,
          scaleX * sy * sp,  scaleY * cp,       0, ty,
          -0.001 * sy,       0.001 * cy * sp,   0, 0,
          scaleX * sy * cp,  scaleY * -sp,      0, 1
        ]);
      }

      canvas.addEventListener('pointerdown', (event) => {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;
        lastX = event.clientX;
        lastY = event.clientY;
        yaw += dx * 0.005;
        pitch = Math.max(-1.2, Math.min(1.2, pitch + dy * 0.005));
      });

      const endDrag = (event) => {
        dragging = false;
        if (canvas.hasPointerCapture(event.pointerId)) {
          canvas.releasePointerCapture(event.pointerId);
        }
      };
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);

      canvas.addEventListener('wheel', (event) => {
        event.preventDefault();
        const delta = Math.sign(event.deltaY);
        zoom = Math.max(0.5, Math.min(3.0, zoom * (delta > 0 ? 1.08 : 0.92)));
      }, { passive: false });

      status.textContent = `Ready: ${result.glyphs.length} glyphs (Slug)`;
      status.className = 'status-ready';

      const render = () => {
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        renderer.render(buildMvp(), color);
        requestAnimationFrame(render);
      };
      render();

      window.addEventListener('resize', resize);
      window.addEventListener('beforeunload', () => renderer.dispose());
    }

    main().catch((error) => {
      console.error(error);
      status.textContent = `Error: ${error.message}`;
      status.className = 'status-error';
    });
  </script>
</body>
</html>
