<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-text interactive demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #0a0a0a;
        color: #f3f3f3;
        font-family: sans-serif;
        overflow: hidden;
      }

      #container {
        position: fixed;
        inset: 0;
      }

      canvas {
        cursor: grab;
        display: block;
      }

      canvas:active {
        cursor: grabbing;
      }

      #status {
        position: fixed;
        bottom: 50px;
        left: 20px;
        padding: 10px 15px;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 4px;
        font-size: 12px;
        z-index: 100;
        backdrop-filter: blur(10px);
      }

      .status-loading {
        color: #ffa500;
      }

      .status-ready {
        color: #00ff00;
      }

      .status-error {
        color: #ff4444;
      }

      #branding {
        position: fixed;
        bottom: 20px;
        left: 20px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.8);
        border-radius: 4px;
        font-size: 11px;
        z-index: 100;
        backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        gap: 8px;
        color: #888;
        text-decoration: none;
      }

      #branding svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      @media (max-width: 768px) {
        #status {
          bottom: 50px;
          left: 10px;
          right: 10px;
          text-align: center;
        }

        #branding {
          bottom: 10px;
          left: 10px;
          right: 10px;
          justify-content: center;
        }
      }
    </style>

    <script type="module">
import * as THREE from "three";
import {
  abs,
  Fn,
  If,
  Discard,
  attribute,
  clamp,
  cos,
  cross,
  dFdx,
  dFdy,
  dot,
  exp,
  float,
  fract,
  length,
  mod,
  modelNormalMatrix,
  normalLocal,
  normalView,
  normalize,
  positionGeometry,
  positionLocal,
  pow,
  sin,
  sqrt,
  transformDirection,
  uniform,
  uv,
  vec2,
  vec3,
  vec4,
  vertexColor,
} from "three/tsl";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GUI } from "three/addons/libs/lil-gui.module.min.js";
import { Text } from "three-text/three";
import { Text as VectorText } from "three-text/vector";

Text.setHarfBuzzPath("/examples/hb/hb.wasm");

const availableLanguages = [
  "en-us", "en-gb", "de-1996", "fr", "es", "it", "pt", "nl", "da", "sv",
  "nb", "nn", "fi", "is", "pl", "cs", "sk", "sl", "hr", "sr-cyrl",

function hexToRgb(hex) {
  const color = new THREE.Color(hex);
  return [color.r, color.g, color.b];
}

let scene;
let camera;
let renderer;
let controls;
let textMesh = null;
let gui = null;
let textFolder = null;
let featuresFolder = null;
let animationFolder = null;

let isRendering = false;
let currentTextInstance = null;
let currentVectorInstance = null;
let currentShaderMode = "wave";
let time = 0;

let customFontBuffer = null;
let currentFontName = "NimbusSanL-Reg.woff";
let lastFontBuffer = null;
let variableFontControllers = [];
let featureControllers = [];
let meshSpecificFolders = [];
let shaderFolders = {};

let vectorInteriorMesh = null;
let vectorCurveMesh = null;
let vectorFillMesh = null;
let vectorInteriorGeo = null;
let vectorCurveGeo = null;
let vectorScene = null;
let vectorWireframeScene = null;
let vectorWireInteriorMesh = null;
let vectorWireCurveMesh = null;

const params = {
  renderMode: "mesh",
  text: `three-text is a 3D font geometry and text layout library for the web. It supports TTF, OTF, WOFF, and WOFF2 font files. For layout, it uses Tex-based parameters for breaking text into paragraphs across multiple lines and supports CJK and RTL scripts. three-text caches the geometries it generates for low CPU overhead in languages with lots of repeating glyphs. Variable fonts are supported as static instances at a given axis coordinate, and can be animated by re-drawing each frame with new coordinates. The library has a framework-agnostic core that returns raw vertex data, with lightweight adapters for Three.js, React Three Fiber, p5.js, WebGL and WebGPU. Under the hood, three-text relies on HarfBuzz for text shaping, Knuth-Plass line breaking, Liang hyphenation, libtess by Eric Veach for tessellation, curve polygonization from Maxim Shemanarev's Anti-Grain Geometry, and Visvalingam-Whyatt line simplification`,
  lineWidth: 1400,
  fontSize: 72,
  lineHeight: 1.33,
  letterSpacing: 0,
  direction: "ltr",
  depth: 7,
  alignment: "justify",
  wireframe: false,
  textColor: "#ffffff",
  backgroundColor: "#111111",
  optimizationEnabled: false,
  areaThreshold: 1.0,
  removeOverlaps: null,

  waveSpeed: 1.0,
  waveHeight: 10,
  waveFrequency: 0.01,

  shaderMode: "wave",

  flipSpeed: 0.3,
  flipPauseDuration: 0.3,

  explodeSpeed: 0.4,
  explodeDistance: 1800,

  orbitRadius: 30,
  orbitSpeed: 0.5,

  twisterSpeed: 0.5,
  twisterHeight: 150,
  twisterRadius: 300,

  hyphenate: true,
  language: "en-us",
  lefthyphenmin: 2,
  righthyphenmin: 4,
  hyphenpenalty: 50,
  exhyphenpenalty: 50,
  doublehyphendemerits: 10000,
  singleworddemerits: 0,

  tolerance: 200,
  pretolerance: 100,
  emergencyStretch: 0,
  linepenalty: 10,
  adjdemerits: 10000,
  respectExistingBreaks: true,
  curveMode: "adaptive",
  curveSteps: 100,
  distanceTolerance: 0.5,
  angleTolerance: 0.25,
};

const textColorU = uniform(new THREE.Color(params.textColor));
const timeU = uniform(0);
const waveHeightU = uniform(params.waveHeight);
const waveFrequencyU = uniform(params.waveFrequency);
const flipSpeedU = uniform(params.flipSpeed);
const flipPauseDurationU = uniform(params.flipPauseDuration);
const minDiagonalU = uniform(0);
const maxDiagonalU = uniform(1);
const explodeSpeedU = uniform(params.explodeSpeed);
const explodeDistanceU = uniform(params.explodeDistance);
const paragraphCenterU = uniform(new THREE.Vector3(0, 0, 0));
const orbitRadiusU = uniform(params.orbitRadius);
const orbitSpeedU = uniform(params.orbitSpeed);
const twisterSpeedU = uniform(params.twisterSpeed);
const twisterHeightU = uniform(params.twisterHeight);
const twisterRadiusU = uniform(params.twisterRadius);

function syncAnimationUniforms() {
  timeU.value = time;
  waveHeightU.value = params.waveHeight;
  waveFrequencyU.value = params.waveFrequency;
  flipSpeedU.value = params.flipSpeed;
  flipPauseDurationU.value = params.flipPauseDuration;
  explodeSpeedU.value = params.explodeSpeed;
  explodeDistanceU.value = params.explodeDistance;
  orbitRadiusU.value = params.orbitRadius;
  orbitSpeedU.value = params.orbitSpeed;
  twisterSpeedU.value = params.twisterSpeed;
  twisterHeightU.value = params.twisterHeight;
  twisterRadiusU.value = params.twisterRadius;
}

const hash1 = Fn(([p]) => {
  return fract(sin(dot(p, vec3(12.9898, 78.233, 45.164))).mul(43758.5453));
});

const hash3 = Fn(([p]) => {
  return vec3(hash1(p), hash1(p.add(vec3(1.0))), hash1(p.add(vec3(2.0))));
});

const rotateAroundAxis = Fn(([localPos, axis, angle]) => {
  const ax = normalize(axis);
  const s = sin(angle);
  const c = cos(angle);
  const oc = float(1.0).sub(c);
  const dotAP = dot(ax, localPos);
  const crossAP = cross(ax, localPos);
  return localPos.mul(c).add(crossAP.mul(s)).add(ax.mul(dotAP).mul(oc));
});

const easeInOutCubic = Fn(([t]) => {
  const result = float(0).toVar();
  If(t.lessThan(0.5), () => {
    result.assign(float(4.0).mul(t).mul(t).mul(t));
  }).Else(() => {
    result.assign(float(1.0).sub(pow(float(-2.0).mul(t).add(2.0), 3.0).div(2.0)));
  });
  return result;
});

const loopBlinnFragment = Fn(() => {
  const curveUV = uv();
  const px = dFdx(curveUV);
  const py = dFdy(curveUV);
  const fx = float(2.0).mul(curveUV.x).mul(px.x).sub(px.y);
  const fy = float(2.0).mul(curveUV.x).mul(py.x).sub(py.y);
  const denom = sqrt(fx.mul(fx).add(fy.mul(fy)));
  const f = curveUV.x.mul(curveUV.x).sub(curveUV.y);
  const sd = f.div(denom.max(1e-6));
  const alpha = clamp(float(0.5).sub(sd), 0.0, 1.0);
  Discard(alpha.lessThanEqual(0.0));
  return vec4(1.0, 1.0, 1.0, alpha);
});

function computeDiagonalRange(glyphCenterAttr) {
  if (!glyphCenterAttr) return { min: 0, max: 1 };
  const arr = glyphCenterAttr.array || glyphCenterAttr;
  let min = Infinity;
  let max = -Infinity;
  for (let i = 0; i < arr.length; i += 3) {
    const diagonal = arr[i] + arr[i + 1];
    if (diagonal < min) min = diagonal;
    if (diagonal > max) max = diagonal;
  }
  return {
    min: Number.isFinite(min) ? min : 0,
    max: Number.isFinite(max) ? max : 1,
  };
}

function setGlyphAttrsOnGeometry(geo, attrs, offsetX = 0, offsetY = 0, offsetZ = 0) {
  if (!attrs) return;

  const glyphCenter = new Float32Array(attrs.glyphCenter);
  if (offsetX !== 0 || offsetY !== 0 || offsetZ !== 0) {
    for (let i = 0; i < glyphCenter.length; i += 3) {
      glyphCenter[i] += offsetX;
      glyphCenter[i + 1] += offsetY;
      glyphCenter[i + 2] += offsetZ;
    }
  }

  geo.setAttribute("glyphCenter", new THREE.Float32BufferAttribute(glyphCenter, 3));
  geo.setAttribute("glyphIndex", new THREE.Float32BufferAttribute(attrs.glyphIndex, 1));
  geo.setAttribute("glyphProgress", new THREE.Float32BufferAttribute(attrs.glyphProgress, 1));
  geo.setAttribute("glyphLineIndex", new THREE.Float32BufferAttribute(attrs.glyphLineIndex, 1));
  geo.setAttribute("glyphBaselineY", new THREE.Float32BufferAttribute(attrs.glyphBaselineY, 1));
}

function setCurveUVsOnGeometry(geo) {
  const curveVertCount = geo.attributes.position.count;
  const curveUVs = new Float32Array(curveVertCount * 2);
  for (let i = 0; i < curveVertCount; i += 3) {
    curveUVs[i * 2] = 0;
    curveUVs[i * 2 + 1] = 0;
    curveUVs[i * 2 + 2] = 0.5;
    curveUVs[i * 2 + 3] = 0;
    curveUVs[i * 2 + 4] = 1;
    curveUVs[i * 2 + 5] = 1;
  }
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(curveUVs, 2));
}

function getGlyphNodes() {
  return {
    glyphCenter: attribute("glyphCenter", "vec3"),
    glyphIndex: attribute("glyphIndex", "float"),
    glyphLineIndex: attribute("glyphLineIndex", "float"),
  };
}

function createWavePositionNode() {
  return Fn(() => {
    const pos = positionLocal.toVar();
    const wave = sin(pos.x.mul(waveFrequencyU).add(timeU)).mul(sin(pos.y.mul(waveFrequencyU).add(timeU)));
    pos.x.addAssign(wave.mul(waveHeightU).mul(0.25));
    pos.y.addAssign(wave.mul(waveHeightU).mul(0.25));
    pos.z.addAssign(wave.mul(waveHeightU));
    return pos;
  })();
}

function createWaveNormalNode() {
  return Fn(() => {
    const newNormal = vec3(normalLocal).toVar();
    const waveGradientX = cos(positionGeometry.x.mul(waveFrequencyU).add(timeU)).mul(waveFrequencyU).mul(waveHeightU).mul(0.25);
    const waveGradientY = cos(positionGeometry.y.mul(waveFrequencyU).add(timeU)).mul(waveFrequencyU).mul(waveHeightU).mul(0.25);
    newNormal.x.subAssign(waveGradientX);
    newNormal.y.subAssign(waveGradientY);
    return transformDirection(normalize(newNormal), modelNormalMatrix);
  })();
}

function createFlipNodes() {
  const { glyphCenter } = getGlyphNodes();

  const positionNode = Fn(() => {
    const diagonalValue = glyphCenter.x.add(glyphCenter.y);
    const diagonalSpan = maxDiagonalU.sub(minDiagonalU).max(1e-6);
    const normalizedDiagonal = diagonalValue.sub(minDiagonalU).div(diagonalSpan);

    const waveDuration = float(0.7);
    const phaseOffset = normalizedDiagonal.mul(waveDuration);
    const cycleTime = timeU.mul(flipSpeedU);
    const flipDuration = float(1.5);
    const totalCycle = flipDuration.add(flipPauseDurationU).add(flipDuration).add(flipPauseDurationU);
    const t = mod(cycleTime, totalCycle).toVar();
    const angle = float(0).toVar();

    If(t.lessThan(flipDuration), () => {
      const progress = t.sub(phaseOffset).toVar();
      If(progress.greaterThanEqual(0.0).and(progress.lessThanEqual(flipDuration)), () => {
        const nt = clamp(progress.div(flipDuration.sub(waveDuration)), 0.0, 1.0);
        angle.assign(easeInOutCubic(nt).mul(Math.PI));
      }).ElseIf(progress.greaterThan(flipDuration), () => {
        angle.assign(Math.PI);
      });
    }).ElseIf(t.lessThan(flipDuration.add(flipPauseDurationU)), () => {
      angle.assign(Math.PI);
    }).ElseIf(t.lessThan(flipDuration.mul(2.0).add(flipPauseDurationU)), () => {
      const backStart = flipDuration.add(flipPauseDurationU);
      const reversePhase = float(1.0).sub(normalizedDiagonal).mul(waveDuration);
      const progress = t.sub(backStart).sub(reversePhase).toVar();
      If(progress.greaterThanEqual(0.0).and(progress.lessThanEqual(flipDuration)), () => {
        const nt = clamp(progress.div(flipDuration.sub(waveDuration)), 0.0, 1.0);
        angle.assign(float(1.0).sub(easeInOutCubic(nt)).mul(Math.PI));
      }).ElseIf(progress.lessThan(0.0), () => {
        angle.assign(Math.PI);
      });
    });

    const localPos = positionLocal.sub(glyphCenter);
    return rotateAroundAxis(localPos, vec3(0.0, 1.0, 0.0), angle).add(glyphCenter);
  })();

  const normalNode = Fn(() => {
    const diagonalValue = glyphCenter.x.add(glyphCenter.y);
    const diagonalSpan = maxDiagonalU.sub(minDiagonalU).max(1e-6);
    const normalizedDiagonal = diagonalValue.sub(minDiagonalU).div(diagonalSpan);

    const waveDuration = float(0.7);
    const phaseOffset = normalizedDiagonal.mul(waveDuration);
    const cycleTime = timeU.mul(flipSpeedU);
    const flipDuration = float(1.5);
    const totalCycle = flipDuration.add(flipPauseDurationU).add(flipDuration).add(flipPauseDurationU);
    const t = mod(cycleTime, totalCycle).toVar();
    const angle = float(0).toVar();

    If(t.lessThan(flipDuration), () => {
      const progress = t.sub(phaseOffset).toVar();
      If(progress.greaterThanEqual(0.0).and(progress.lessThanEqual(flipDuration)), () => {
        const nt = clamp(progress.div(flipDuration.sub(waveDuration)), 0.0, 1.0);
        angle.assign(easeInOutCubic(nt).mul(Math.PI));
      }).ElseIf(progress.greaterThan(flipDuration), () => {
        angle.assign(Math.PI);
      });
    }).ElseIf(t.lessThan(flipDuration.add(flipPauseDurationU)), () => {
      angle.assign(Math.PI);
    }).ElseIf(t.lessThan(flipDuration.mul(2.0).add(flipPauseDurationU)), () => {
      const backStart = flipDuration.add(flipPauseDurationU);
      const reversePhase = float(1.0).sub(normalizedDiagonal).mul(waveDuration);
      const progress = t.sub(backStart).sub(reversePhase).toVar();
      If(progress.greaterThanEqual(0.0).and(progress.lessThanEqual(flipDuration)), () => {
        const nt = clamp(progress.div(flipDuration.sub(waveDuration)), 0.0, 1.0);
        angle.assign(float(1.0).sub(easeInOutCubic(nt)).mul(Math.PI));
      }).ElseIf(progress.lessThan(0.0), () => {
        angle.assign(Math.PI);
      });
    });

    const rotatedNormal = rotateAroundAxis(normalLocal, vec3(0.0, 1.0, 0.0), angle);
    return transformDirection(normalize(rotatedNormal), modelNormalMatrix);
  })();

  return { positionNode, normalNode };
}

function createExplodeNodes() {
  const { glyphCenter } = getGlyphNodes();

  const buildTumble = () => {
    const glyphSeed = glyphCenter.mul(0.01);
    const vertexSeed = positionLocal.mul(0.01);
    const chaos = hash3(glyphSeed).sub(0.5);
    const fallbackDir = vec3(0.0, 1.0, 0.0);
    const radialDir = fallbackDir.toVar();
    const radialLen = length(glyphCenter.sub(paragraphCenterU));
    If(radialLen.greaterThan(0.001), () => {
      radialDir.assign(normalize(glyphCenter.sub(paragraphCenterU)));
    });

    const chaoticDir = normalize(radialDir.add(chaos.mul(2.5)));
    const distFromCenter = length(glyphCenter.sub(paragraphCenterU));
    const cycleTime = timeU.mul(explodeSpeedU);
    const t = mod(cycleTime, 8.0);
    const shockwaveDelay = distFromCenter.mul(0.0008);
    const phaseT = t.sub(shockwaveDelay).toVar();
    const offset = float(0).toVar();
    const tumbleAngle = float(0).toVar();
    const scatter = float(0).toVar();

    If(phaseT.greaterThanEqual(0.0).and(phaseT.lessThan(2.4)), () => {
      const outT = phaseT.div(2.4);
      const curve = outT.mul(outT).mul(float(3.0).sub(float(2.0).mul(outT)));
      offset.assign(explodeDistanceU.mul(4.8).mul(curve));
      tumbleAngle.assign(float(40.0).mul(hash1(glyphSeed).sub(0.5)).mul(curve));
      scatter.assign(float(200.0).mul(curve));
    }).ElseIf(phaseT.greaterThanEqual(2.4).and(phaseT.lessThan(3.2)), () => {
      offset.assign(explodeDistanceU.mul(4.8));
      tumbleAngle.assign(float(40.0).mul(hash1(glyphSeed).sub(0.5)));
      scatter.assign(200.0);
    }).ElseIf(phaseT.greaterThanEqual(3.2).and(phaseT.lessThan(5.8)), () => {
      const returnT = phaseT.sub(3.2).div(2.6);
      const curve = returnT.mul(returnT).mul(float(3.0).sub(float(2.0).mul(returnT)));
      offset.assign(explodeDistanceU.mul(4.8).mul(float(1.0).sub(curve)));
      tumbleAngle.assign(float(40.0).mul(hash1(glyphSeed).sub(0.5)).mul(float(1.0).sub(curve)));
      scatter.assign(float(200.0).mul(float(1.0).sub(curve)));
    });

    const tumbleAxis = vec3(0.0, 1.0, 0.0).toVar();
    If(length(chaos).greaterThan(0.001), () => {
      tumbleAxis.assign(normalize(chaos));
    });

    return { glyphSeed, vertexSeed, chaoticDir, offset, tumbleAxis, tumbleAngle, scatter };
  };

  const positionNode = Fn(() => {
    const { vertexSeed, chaoticDir, offset, tumbleAxis, tumbleAngle, scatter } = buildTumble();
    const pos = positionLocal.toVar();
    const localPos = pos.sub(glyphCenter);
    pos.assign(rotateAroundAxis(localPos, tumbleAxis, tumbleAngle).add(glyphCenter));
    pos.addAssign(hash3(vertexSeed).sub(0.5).mul(scatter));
    pos.addAssign(chaoticDir.mul(offset));
    return pos;
  })();

  const normalNode = Fn(() => {
    const { tumbleAxis, tumbleAngle } = buildTumble();
    const rotatedNormal = rotateAroundAxis(normalLocal, tumbleAxis, tumbleAngle);
    return transformDirection(normalize(rotatedNormal), modelNormalMatrix);
  })();

  return { positionNode, normalNode };
}

function createOrbitNodes() {
  const { glyphIndex } = getGlyphNodes();

  const positionNode = Fn(() => {
    const phase = glyphIndex.mul(0.3);
    const angle = timeU.mul(orbitSpeedU).add(phase);
    const circularOffset = vec2(cos(angle), sin(angle)).mul(orbitRadiusU);
    const zOffset = sin(angle.mul(1.5)).mul(orbitRadiusU).mul(1.5);
    return positionLocal.add(vec3(circularOffset.x, circularOffset.y, zOffset));
  })();

  return { positionNode, normalNode: null };
}

function createTwisterNodes() {
  const { glyphCenter } = getGlyphNodes();

  const buildTwister = () => {
    const glyphSeed = glyphCenter.mul(0.01);
    const distanceFromCenter = length(vec2(glyphCenter.x, glyphCenter.z));
    const verticalPos = glyphCenter.y;
    const vortexPull = exp(distanceFromCenter.mul(-0.001));
    const glyphPhaseOffset = hash1(glyphSeed).mul(0.5);
    const t = timeU.mul(twisterSpeedU);
    const vortexAngle = t.add(verticalPos.mul(0.004)).add(vortexPull.mul(6.0)).add(glyphPhaseOffset);
    const breathe = sin(t.mul(0.3).add(glyphPhaseOffset)).mul(0.2).add(1.0);
    const spiralRadius = twisterRadiusU.mul(vortexPull).mul(breathe);
    const spiralOffset = vec2(cos(vortexAngle), sin(vortexAngle)).mul(spiralRadius);
    const uplift = sin(vortexAngle.add(glyphPhaseOffset)).mul(twisterHeightU).mul(vortexPull);
    const windAxis = normalize(vec3(hash1(glyphSeed).sub(0.5), 0.8, hash1(glyphSeed.add(vec3(1.0))).sub(0.5)));
    const tumble = vortexAngle.mul(0.2).mul(vortexPull);
    return { spiralOffset, uplift, windAxis, tumble };
  };

  const positionNode = Fn(() => {
    const { spiralOffset, uplift, windAxis, tumble } = buildTwister();
    const pos = positionLocal.toVar();
    const localPos = pos.sub(glyphCenter);
    pos.assign(rotateAroundAxis(localPos, windAxis, tumble).add(glyphCenter));
    pos.addAssign(vec3(spiralOffset.x, uplift, spiralOffset.y));
    return pos;
  })();

  const normalNode = Fn(() => {
    const { windAxis, tumble } = buildTwister();
    const rotatedNormal = rotateAroundAxis(normalLocal, windAxis, tumble);
    return transformDirection(normalize(rotatedNormal), modelNormalMatrix);
  })();

  return { positionNode, normalNode };
}

function createMeshNodes(mode) {
  switch (mode) {
    case "wave":
      return { positionNode: createWavePositionNode(), normalNode: createWaveNormalNode() };
    case "flip":
      return createFlipNodes();
    case "explode":
      return createExplodeNodes();
    case "orbit":
      return createOrbitNodes();
    case "twister":
      return createTwisterNodes();
    default:
      return { positionNode: null, normalNode: null };
  }
}

function createVectorPositionNode(mode) {
  switch (mode) {
    case "wave":
      return createWavePositionNode();
    case "flip":
      return createFlipNodes().positionNode;
    case "explode":
      return createExplodeNodes().positionNode;
    case "orbit":
      return createOrbitNodes().positionNode;
    case "twister":
      return createTwisterNodes().positionNode;
    default:
      return null;
  }
}

function createMeshMaterial(mode) {
  const animatedDoubleSided = ["flip", "explode", "orbit", "twister"].includes(mode);
  const material = new THREE.MeshBasicNodeMaterial();
  material.transparent = true;
  material.opacity = 1.0;
  material.wireframe = params.wireframe;
  material.side = (params.depth === 0 || animatedDoubleSided) ? THREE.DoubleSide : THREE.FrontSide;

  const { positionNode, normalNode } = createMeshNodes(mode);
  if (positionNode) material.positionNode = positionNode;
  if (normalNode) material.normalNode = normalNode;

  const lightDir = normalize(vec3(1.0, 1.0, 1.0));
  const lightIntensity = clamp(abs(dot(normalize(normalView), lightDir)).mul(0.7).add(0.3), 0.0, 1.0);
  material.colorNode = vertexColor().mul(lightIntensity);

  return material;
}

function applyStencilNonzero(mat, side) {
  mat.depthTest = false;
  mat.depthWrite = false;
  mat.side = side;
  mat.stencilWrite = true;
  mat.stencilFunc = THREE.AlwaysStencilFunc;
  mat.stencilRef = 0;
  mat.stencilFuncMask = 0xff;
  mat.stencilWriteMask = 0xff;
  mat.stencilFail = THREE.KeepStencilOp;
  mat.stencilZFail = THREE.KeepStencilOp;
  mat.stencilZPass = side === THREE.FrontSide
    ? THREE.IncrementWrapStencilOp
    : THREE.DecrementWrapStencilOp;
}

function makeStencilPair(side, extra) {
  const mat = new THREE.MeshBasicNodeMaterial();
  applyStencilNonzero(mat, side);
  mat.colorWrite = false;
  if (extra) extra(mat);
  return mat;
}

function createVectorMaterials(mode) {
  const displacementNode = createVectorPositionNode(mode);

  const applyDisplacement = (mat) => {
    if (displacementNode) mat.positionNode = displacementNode;
  };

  const interiorMats = [THREE.FrontSide, THREE.BackSide].map(side =>
    makeStencilPair(side, applyDisplacement)
  );

  const curveMats = [THREE.FrontSide, THREE.BackSide].map(side =>
    makeStencilPair(side, (mat) => {
      mat.alphaToCoverage = true;
      mat.fragmentNode = loopBlinnFragment();
      applyDisplacement(mat);
    })
  );

  const colorMat = new THREE.MeshBasicNodeMaterial();
  colorMat.depthTest = false;
  colorMat.depthWrite = false;
  colorMat.side = THREE.DoubleSide;
  colorMat.stencilWrite = true;
  colorMat.stencilFunc = THREE.NotEqualStencilFunc;
  colorMat.stencilRef = 0;
  colorMat.stencilFuncMask = 0xff;
  colorMat.stencilWriteMask = 0xff;
  colorMat.stencilFail = THREE.KeepStencilOp;
  colorMat.stencilZFail = THREE.KeepStencilOp;
  colorMat.stencilZPass = THREE.ZeroStencilOp;
  colorMat.colorNode = textColorU;
  if (displacementNode) colorMat.positionNode = displacementNode;

  return { interiorMats, curveMats, colorMat };
}

function setMeshControlsVisible(visible) {
  for (const folder of meshSpecificFolders) {
    if (visible) folder.show();
    else folder.hide();
  }
}

function updateShaderFolderVisibility(mode) {
  Object.keys(shaderFolders).forEach((key) => {
    if (!shaderFolders[key]) return;
    if (key === mode) shaderFolders[key].show();
    else shaderFolders[key].hide();
  });
}

function switchVectorShaderMode(mode) {
  if (!vectorInteriorMesh || !vectorCurveMesh || !vectorFillMesh) return;

  const diagRange = computeDiagonalRange(vectorInteriorGeo.attributes.glyphCenter);
  minDiagonalU.value = diagRange.min;
  maxDiagonalU.value = diagRange.max;

  const { interiorMats, curveMats, colorMat } = createVectorMaterials(mode);

  vectorInteriorMesh.children.forEach((c, i) => { c.material.dispose(); c.material = interiorMats[i]; });
  vectorCurveMesh.children.forEach((c, i) => { c.material.dispose(); c.material = curveMats[i]; });
  vectorFillMesh.material.dispose();
  vectorFillMesh.material = colorMat;
}

function switchShaderMode(mode) {
  updateShaderFolderVisibility(mode);

  if (params.renderMode === "vector") {
    switchVectorShaderMode(mode);
    return;
  }

  if (!textMesh) return;

  const needsAttributes = ["flip", "explode", "orbit", "twister"].includes(mode);
  const hasAttributes = textMesh.geometry.attributes.glyphCenter !== undefined;

  if ((needsAttributes && !hasAttributes) || (!needsAttributes && hasAttributes)) {
    renderText();
    return;
  }

  if (textMesh.material) {
    textMesh.material.dispose();
  }

  textMesh.material = createMeshMaterial(mode);
}

function getSharedTextOptions() {
  const fontVariations = {};
  for (const key in params) {
    if (key.startsWith("fontVar_")) fontVariations[key.replace("fontVar_", "")] = params[key];
  }

  const fontFeatures = {};
  for (const key in params) {
    if (key.startsWith("fontFeat_")) fontFeatures[key.replace("fontFeat_", "")] = params[key];
  }

  const font = customFontBuffer || "./fonts/NimbusSanL-Reg.woff";

  return {
    text: params.text,
    font,
    size: params.fontSize,
    lineHeight: params.lineHeight,
    letterSpacing: params.letterSpacing,
    fontVariations: Object.keys(fontVariations).length > 0 ? fontVariations : undefined,
    fontFeatures: Object.keys(fontFeatures).length > 0 ? fontFeatures : undefined,
    layout: {
      width: params.lineWidth,
      align: params.alignment,
      direction: params.direction,
      hyphenate: params.hyphenate,
      language: params.language,
      tolerance: params.tolerance,
      pretolerance: params.pretolerance,
      emergencyStretch: params.emergencyStretch,
      respectExistingBreaks: params.respectExistingBreaks,
      lefthyphenmin: params.lefthyphenmin,
      righthyphenmin: params.righthyphenmin,
      linepenalty: params.linepenalty,
      adjdemerits: params.adjdemerits,
      hyphenpenalty: params.hyphenpenalty,
      exhyphenpenalty: params.exhyphenpenalty,
      doublehyphendemerits: params.doublehyphendemerits,
      singleworddemerits: params.singleworddemerits,
    },
  };
}

function clearVectorScenes() {
  if (vectorScene) vectorScene.clear();
  if (vectorWireframeScene) vectorWireframeScene.clear();

  if (vectorInteriorMesh) {
    vectorInteriorMesh.children.forEach(c => c.material.dispose());
    if (vectorInteriorGeo) vectorInteriorGeo.dispose();
  }
  if (vectorCurveMesh) {
    vectorCurveMesh.children.forEach(c => c.material.dispose());
    if (vectorCurveGeo) vectorCurveGeo.dispose();
  }
  if (vectorFillMesh) {
    vectorFillMesh.geometry.dispose();
    vectorFillMesh.material.dispose();
  }
  if (vectorWireInteriorMesh) {
    vectorWireInteriorMesh.material.dispose();
  }
  if (vectorWireCurveMesh) {
    vectorWireCurveMesh.material.dispose();
  }

  vectorInteriorMesh = null;
  vectorCurveMesh = null;
  vectorFillMesh = null;
  vectorInteriorGeo = null;
  vectorCurveGeo = null;
  vectorScene = null;
  vectorWireframeScene = null;
  vectorWireInteriorMesh = null;
  vectorWireCurveMesh = null;
}

function updateFontControls(loadedFont) {
  const currentFontBuffer = customFontBuffer || "./fonts/NimbusSanL-Reg.woff";
  if (lastFontBuffer === currentFontBuffer) return;

  lastFontBuffer = currentFontBuffer;
  clearVariableFontControls();
  clearFeatureControls();

  const axes = loadedFont?.variationAxes || null;
  if (customFontBuffer && axes) {
    addVariableFontControls(axes, textFolder);
  }

  const features = loadedFont?.availableFeatures || null;
  const featureNames = loadedFont?.featureNames || {};
  if (features && features.length > 0) {
    addOpenTypeFeatureControls(features, featureNames, textFolder);
  }
}

async function renderTextMesh(opts) {
  const needsGlyphAttributes = ["flip", "explode", "orbit", "twister"].includes(params.shaderMode);
  const textColorRgb = hexToRgb(params.textColor);
  const meshOpts = {
    ...opts,
    depth: params.depth,
    color: textColorRgb,
    removeOverlaps: params.removeOverlaps,
    perGlyphAttributes: needsGlyphAttributes,
    curveSteps: params.curveMode === "steps" ? params.curveSteps : 0,
    curveFidelity: {
      distanceTolerance: params.distanceTolerance,
      angleTolerance: params.angleTolerance,
    },
    geometryOptimization: {
      enabled: params.optimizationEnabled,
      areaThreshold: params.areaThreshold,
    },
  };

  const result = currentTextInstance ? await currentTextInstance.update(meshOpts) : await Text.create(meshOpts);
  currentTextInstance = result;
  updateFontControls(result.getLoadedFont());

  clearVectorScenes();
  if (textMesh) textMesh.visible = true;

  result.geometry.computeBoundingBox();
  const center = new THREE.Vector3();
  result.geometry.boundingBox.getCenter(center);
  result.geometry.translate(-center.x, -center.y, -center.z);

  const glyphCenterAttr = result.geometry.attributes.glyphCenter;
  if (glyphCenterAttr) {
    for (let i = 0; i < glyphCenterAttr.count; i++) {
      glyphCenterAttr.setXYZ(
        i,
        glyphCenterAttr.getX(i) - center.x,
        glyphCenterAttr.getY(i) - center.y,
        glyphCenterAttr.getZ(i) - center.z,
      );
    }
    glyphCenterAttr.needsUpdate = true;
  }

  const diagRange = computeDiagonalRange(glyphCenterAttr);
  minDiagonalU.value = diagRange.min;
  maxDiagonalU.value = diagRange.max;
  paragraphCenterU.value.set(0, 0, 0);

  const material = createMeshMaterial(params.shaderMode);
  if (textMesh) {
    const oldGeo = textMesh.geometry;
    const oldMat = textMesh.material;
    textMesh.geometry = result.geometry;
    textMesh.material = material;
    oldGeo?.dispose();
    oldMat?.dispose();
  } else {
    textMesh = new THREE.Mesh(result.geometry, material);
    textMesh.rotation.x = 0;
    textMesh.rotation.y = 0.5;
    scene.add(textMesh);
  }

  return result;
}

async function renderTextVector(opts) {
  if (textMesh) textMesh.visible = false;

  const result = currentVectorInstance ? await currentVectorInstance.update(opts) : await VectorText.create(opts);
  currentVectorInstance = result;
  updateFontControls(result.getLoadedFont());
  clearVectorScenes();
  return renderLoopBlinnData(result);
}

function renderLoopBlinnData(result) {
  const loopBlinnData = result.geometryData;
  const bounds = loopBlinnData.planeBounds;
  const centerX = (bounds.min.x + bounds.max.x) * 0.5;
  const centerY = (bounds.min.y + bounds.max.y) * 0.5;

  const interiorGeo = new THREE.BufferGeometry();
  interiorGeo.setAttribute("position", new THREE.Float32BufferAttribute(loopBlinnData.interiorPositions, 3));
  interiorGeo.setIndex(new THREE.BufferAttribute(loopBlinnData.interiorIndices, 1));
  interiorGeo.translate(-centerX, -centerY, 0);
  setGlyphAttrsOnGeometry(interiorGeo, loopBlinnData.interiorGlyphAttrs, -centerX, -centerY, 0);

  const curveGeo = new THREE.BufferGeometry();
  curveGeo.setAttribute("position", new THREE.Float32BufferAttribute(loopBlinnData.curvePositions, 3));
  curveGeo.translate(-centerX, -centerY, 0);
  setGlyphAttrsOnGeometry(curveGeo, loopBlinnData.curveGlyphAttrs, -centerX, -centerY, 0);
  setCurveUVsOnGeometry(curveGeo);

  const fillGeo = new THREE.BufferGeometry();
  fillGeo.setAttribute("position", new THREE.Float32BufferAttribute(loopBlinnData.fillPositions, 3));
  fillGeo.setIndex(new THREE.BufferAttribute(loopBlinnData.fillIndices, 1));
  fillGeo.translate(-centerX, -centerY, 0);
  setGlyphAttrsOnGeometry(fillGeo, loopBlinnData.fillGlyphAttrs, -centerX, -centerY, 0);

  const diagRange = computeDiagonalRange(interiorGeo.attributes.glyphCenter);
  minDiagonalU.value = diagRange.min;
  maxDiagonalU.value = diagRange.max;
  paragraphCenterU.value.set(0, 0, 0);

  vectorInteriorGeo = interiorGeo;
  vectorCurveGeo = curveGeo;

  const { interiorMats, curveMats, colorMat } = createVectorMaterials(params.shaderMode);

  vectorInteriorMesh = new THREE.Group();
  interiorMats.forEach(mat => vectorInteriorMesh.add(new THREE.Mesh(interiorGeo, mat)));
  vectorCurveMesh = new THREE.Group();
  curveMats.forEach(mat => vectorCurveMesh.add(new THREE.Mesh(curveGeo, mat)));
  vectorFillMesh = new THREE.Mesh(fillGeo, colorMat);

  vectorInteriorMesh.children.forEach(c => c.renderOrder = 0);
  vectorCurveMesh.children.forEach(c => c.renderOrder = 1);
  vectorFillMesh.renderOrder = 2;
  vectorInteriorMesh.rotation.y = 0.5;
  vectorCurveMesh.rotation.y = 0.5;
  vectorFillMesh.rotation.y = 0.5;

  vectorScene = new THREE.Scene();
  vectorScene.add(vectorInteriorMesh, vectorCurveMesh, vectorFillMesh);

  const wireframeMat = new THREE.MeshBasicMaterial({
    color: 0x00ff00,
    wireframe: true,
    transparent: true,
    opacity: 0.4,
    depthTest: false,
  });
  vectorWireInteriorMesh = new THREE.Mesh(interiorGeo, wireframeMat);
  vectorWireCurveMesh = new THREE.Mesh(curveGeo, wireframeMat);
  vectorWireInteriorMesh.rotation.y = 0.5;
  vectorWireCurveMesh.rotation.y = 0.5;
  vectorWireframeScene = new THREE.Scene();
  vectorWireframeScene.add(vectorWireInteriorMesh);
  vectorWireframeScene.add(vectorWireCurveMesh);

  const { interiorTriangleCount, curveTriangleCount } = loopBlinnData.stats;
  return {
    label: `Loop-Blinn TSL: ${interiorTriangleCount + curveTriangleCount} tris (${interiorTriangleCount} interior + ${curveTriangleCount} curve)`,
  };
}

async function renderText() {
  if (isRendering) return;
  isRendering = true;

  try {
    updateStatus("Rendering text...", "loading");
    const startTime = performance.now();
    const opts = getSharedTextOptions();

    if (params.renderMode === "vector") {
      const { label } = await renderTextVector(opts);
      updateStatus(`${label} in ${Math.round(performance.now() - startTime)}ms`, "ready");
    } else {
      const result = await renderTextMesh(opts);
      updateStatus(`${result.stats.trianglesGenerated.toLocaleString()} triangles in ${Math.round(performance.now() - startTime)}ms`, "ready");
    }
  } catch (error) {
    console.error("Error rendering text:", error);
    updateStatus(`Error: ${error.message}`, "error");
  } finally {
    isRendering = false;
  }
}

      left: 24px;
      right: 24px;
      bottom: 24px;
      border: 4px dashed #0066cc;
      border-radius: 8px;
      pointer-events: none;
    }

    .drag-content {
      text-align: center;
      color: white;
      padding: 40px;
      position: relative;
      z-index: 1;
    }

    .drag-content h2 {
      margin: 0 0 16px 0;
      font-size: 48px;
      color: #0066cc;
      font-weight: 600;
    }

    .drag-content p {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #ccc;
    }

    .drag-content p:last-child {
      margin: 0;
      font-size: 18px;
      color: #888;
    }

    .drag-content .current span {
      color: #0066cc;
      font-weight: 500;
    }
  `;

  document.head.appendChild(style);
  document.body.appendChild(overlay);

  const isMobile = window.innerWidth < 768 || "ontouchstart" in window;
  if (isMobile) return;

  document.addEventListener("dragover", (e) => {
    e.preventDefault();
    const items = Array.from(e.dataTransfer.items);
    const hasFont = items.some((item) => {
      const type = item.type;
      return type === "font/ttf" || type === "font/otf";
    });

    if (hasFont) {
      const currentSpan = overlay.querySelector(".current span");
      if (currentSpan) currentSpan.textContent = currentFontName;
      overlay.style.display = "flex";
    }
  });

  document.addEventListener("dragleave", (e) => {
    if (!document.body.contains(e.relatedTarget)) {
      overlay.style.display = "none";
    }
  });

  document.addEventListener("drop", (e) => {
    e.preventDefault();
    overlay.style.display = "none";
    const files = Array.from(e.dataTransfer.files);
    const fontFile = files.find((file) => {
      const ext = file.name.toLowerCase();
      return ext.endsWith(".ttf") || ext.endsWith(".otf") || ext.endsWith(".woff") || ext.endsWith(".woff2");
    });
    if (fontFile) loadCustomFont(fontFile);
  });
}

function handleFontUpload(event) {
  const file = event.target.files[0];
  if (file) loadCustomFont(file);
}

function clearVariableFontControls() {
  variableFontControllers.forEach((controller) => controller.destroy());
  variableFontControllers = [];
}

function clearFeatureControls() {
  featureControllers.forEach((controller) => controller.destroy());
  featureControllers = [];
  if (featuresFolder) {
    featuresFolder.destroy();
    featuresFolder = null;
  }
}

function addVariableFontControls(axes, folder) {
  clearVariableFontControls();
  if (!axes || Object.keys(axes).length === 0) return;

  for (const [tag, axisInfo] of Object.entries(axes)) {
    const name = axisInfo.name || tag;
    params[`fontVar_${tag}`] = axisInfo.default;
    const controller = folder
      .add(params, `fontVar_${tag}`, axisInfo.min, axisInfo.max, tag === "slnt" ? 0.1 : 1)
      .name(name)
      .onChange(() => renderText());
    variableFontControllers.push(controller);
  }
}

function addOpenTypeFeatureControls(features, featureNames, folder) {
  clearFeatureControls();
  if (!features || features.length === 0) return;

  featuresFolder = folder.addFolder("OpenType features");
  featuresFolder.close();

  const defaultEnabled = new Set(["abvm", "blwm", "ccmp", "locl", "mark", "mkmk", "rlig", "calt", "clig", "curs", "dist", "kern", "liga", "rclt"]);
  const common = features.filter((f) => ["liga", "kern", "calt", "clig", "dlig", "smcp", "onum", "lnum", "tnum", "pnum"].includes(f));
  const stylistic = features.filter((f) => /^ss\d{2}$/.test(f)).sort();
  const variants = features.filter((f) => /^cv\d{2}$/.test(f)).sort();

  for (const tag of common) {
    params[`fontFeat_${tag}`] = defaultEnabled.has(tag);
    featureControllers.push(featuresFolder.add(params, `fontFeat_${tag}`).name(tag).onChange(() => renderText()));
  }

  for (const tag of stylistic) {
    params[`fontFeat_${tag}`] = false;
    let displayName = featureNames[tag] || tag;
    if (/^(ss|cv)\d{2}$/.test(tag) && featureNames[tag]) displayName = `${tag}: ${featureNames[tag]}`;
    featureControllers.push(featuresFolder.add(params, `fontFeat_${tag}`).name(displayName).onChange(() => renderText()));
  }

  for (const tag of variants) {
    params[`fontFeat_${tag}`] = false;
    let displayName = featureNames[tag] || tag;
    if (/^(ss|cv)\d{2}$/.test(tag) && featureNames[tag]) displayName = `${tag}: ${featureNames[tag]}`;
    featureControllers.push(featuresFolder.add(params, `fontFeat_${tag}`).name(displayName).onChange(() => renderText()));
  }
}

async function loadCustomFont(file) {
  try {
    updateStatus(`Loading ${file.name}...`, "loading");
    customFontBuffer = await file.arrayBuffer();
    currentFontName = file.name;
    currentTextInstance = null;
    currentVectorInstance = null;

    if (window.fontDisplay && window.fontController) {
      window.fontDisplay.currentFont = currentFontName;
      window.fontController.updateDisplay();
    }

    await renderText();
  } catch (error) {
    console.error("Font loading error:", error);
    updateStatus(`Error loading ${file.name}: ${error.message}`, "error");
  }
}

async function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(params.backgroundColor);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 100, 50000);
  camera.position.set(-20, 20, 3000);

  renderer = new THREE.WebGPURenderer({
    antialias: true,
    stencil: true,
    depth: true,
  });
  await renderer.init();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById("container").appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.screenSpacePanning = false;
  controls.minDistance = 1000;
  controls.maxDistance = 8000;
  controls.maxPolarAngle = Math.PI / 1.2;
  controls.target.set(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
  directionalLight.position.set(1, 1, 1);
  scene.add(directionalLight);

  window.addEventListener("resize", onWindowResize, false);
}

function animate(timeMs) {
  time = timeMs * 0.001;
  syncAnimationUniforms();
  controls.update();

  if (params.renderMode === "vector") {
    if (!vectorInteriorMesh || !vectorCurveMesh || !vectorFillMesh || !vectorScene) {
      renderer.render(scene, camera);
      return;
    }

    const canOverlap = ["flip", "orbit", "explode", "twister"].includes(currentShaderMode);
    const ranges = currentVectorInstance?.geometryData?.glyphRanges;
    const interiorGeo = vectorInteriorGeo;
    const curveGeo = vectorCurveGeo;
    const fillGeo = vectorFillMesh.geometry;

    if (canOverlap && ranges && ranges.length > 0) {
      // Per-glyph rendering: manual clear, no scene background so stencil persists
      // between render calls. Each glyph's fill pass zeros its stencil area.
      vectorScene.background = null;
      renderer.autoClear = false;
      renderer.setClearColor(scene.background || 0x111111, 1);
      renderer.clear(true, true, true);

      for (let g = 0; g < ranges.length; g++) {
        const range = ranges[g];
        interiorGeo.setDrawRange(range.interiorIndexStart, range.interiorIndexCount);
        curveGeo.setDrawRange(range.curveVertexStart, range.curveVertexCount);
        fillGeo.setDrawRange(g * 6, 6);
        renderer.render(vectorScene, camera);
      }

      interiorGeo.setDrawRange(0, Infinity);
      curveGeo.setDrawRange(0, Infinity);
      fillGeo.setDrawRange(0, Infinity);
    } else {
      // Single-pass: scene background triggers clear, all 3 meshes rendered
      // in one pass via renderOrder so stencil is shared within the pass.
      vectorScene.background = scene.background;
      renderer.autoClear = true;
      renderer.render(vectorScene, camera);
    }

    if (params.wireframe && vectorWireframeScene) {
      renderer.autoClear = false;
      renderer.render(vectorWireframeScene, camera);
    }

    renderer.autoClear = true;
  } else {
    renderer.autoClear = true;
    renderer.render(scene, camera);
  }
}

async function init() {
  updateStatus("Initializing Three.js...", "loading");
  const { woff2Decode } = await import("woff-lib");
  Text.enableWoff2(woff2Decode);
  await initScene();
  initGUI();
  setMeshControlsVisible(true);
  textColorU.value.set(params.textColor);
  await renderText();
  renderer.setAnimationLoop(animate);
}

init().catch((error) => {
  console.error("Initialization error:", error);
  updateStatus(`Initialization failed: ${error.message}`, "error");
});
